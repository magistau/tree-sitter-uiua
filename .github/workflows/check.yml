# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Checks
on:
  - push
  - pull_request
jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run .#gha-check
